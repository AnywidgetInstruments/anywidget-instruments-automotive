# Documentation site, published to GitHub Pages — the workflow of anywidget-instruments,
# without the package build and JupyterLite, since there is no package yet. The marimo
# previews install anywidget-instruments from the wheel its own site publishes.
name: Docs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material marimo
      - name: MkDocs (offline-capable, strict)
        run: mkdocs build --strict -d site
      # The preview installs anywidget-instruments in the browser from the wheel that
      # library publishes on its own site, so nothing is built here.
      - name: marimo WebAssembly exports
        run: |
          for nb in lite/marimo/*.py; do
            name=$(basename "$nb" .py)
            marimo export html-wasm "$nb" -o "site/marimo/$name" --mode run --show-code
            rm -f "site/marimo/$name/CLAUDE.md"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Published from pushes to main (Settings > Pages > Source: GitHub Actions).
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

site_name: anywidget-automotives
site_description: Automotive instruments for computational notebooks
site_url: https://s-celles.github.io/anywidget-automotives/
repo_url: https://github.com/s-celles/anywidget-automotives
edit_uri: ""
# Buildable offline — no Google Fonts, no CDN assets, as anywidget-instruments.
theme:
  name: material
  font: false
  features:
    - navigation.sections
    - content.code.copy
  # System preference by default; the toggle cycles light, dark, system.
  palette:
    - media: "(prefers-color-scheme)"
      toggle: { icon: material/brightness-auto, name: Switch to light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-sunny, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-night, name: Switch to system preference }
nav:
  - Home: index.md
  - Widget catalog:
      - Overview: widgets.md
      - Dials:
          - Speedometer: widgets/speedometer.md
          - Tachometer: widgets/tachometer.md
          - FuelGauge: widgets/fuel-gauge.md
          - TemperatureGauge: widgets/temperature-gauge.md
      - Tell-tales:
          - TellTale: widgets/tell-tale.md
          - TellTaleCluster: widgets/tell-tale-cluster.md
      - Digital displays:
          - TripComputer: widgets/trip-computer.md
          - Odometer: widgets/odometer.md
          - GearIndicator: widgets/gear-indicator.md
      - Electric and hybrid:
          - PowerMeter: widgets/power-meter.md
          - StateOfChargeGauge: widgets/state-of-charge-gauge.md
          - PowerFlow: widgets/power-flow.md
      - Layout:
          - Cluster: widgets/cluster.md
  - Examples: examples.md
  - Safety notice: safety.md
  - Standards and references: standards.md
  - Guides:
      - Hosts: hosts.md
      - Head-up display mode: hud.md
      - Use with CAN & CANopen Studio: integration.md
  - Specification: specification.md
  - Requirements status: requirements-status.md
  - Roadmap: roadmap.md
  - Development: development.md
plugins:
  - search
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences

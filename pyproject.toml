[build-system]
requires = ["hatchling", "hatch-jupyter-builder>=0.8"]
build-backend = "hatchling.build"

[project]
name = "anywidget-automotives"
version = "0.1.0.dev0"
description = "Automotive instruments (speedometer, tachometer, gauges, tell-tales, trip computer, cluster, head-up display) for computational notebooks, built on anywidget-instruments."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sébastien Celles" }]
keywords = ["anywidget", "jupyter", "marimo", "automotive", "dashboard", "instrument-cluster", "widgets"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Jupyter",
  "Framework :: Jupyter :: JupyterLab",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Visualization",
]
# The widgets derive from anywidget-instruments (GEN-007). It is not on the
# package index yet: install it first from its repository, at the commit the
# front end is built against (package.json), as the CI workflow does.
dependencies = ["anywidget-instruments", "anywidget>=0.9", "traitlets>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18", "ruff>=0.6", "mypy>=1.10"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "marimo>=0.14"]

[project.urls]
Homepage = "https://github.com/s-celles/anywidget-automotives"
Issues = "https://github.com/s-celles/anywidget-automotives/issues"
Documentation = "https://s-celles.github.io/anywidget-automotives/"
Specification = "https://s-celles.github.io/anywidget-automotives/specification/"

[tool.hatch.build]
only-packages = true
# data directories are not Python packages: only-packages would leave them out
artifacts = [
  "src/anywidget_automotives/static/*",
  "src/anywidget_automotives/schema/*.json",
]

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
  "src/anywidget_automotives/static/index.js",
  "src/anywidget_automotives/static/index.css",
  "src/anywidget_automotives/static/contract.json",
]
skip-if-exists = ["src/anywidget_automotives/static/index.js"]
dependencies = ["hatch-jupyter-builder>=0.8"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
npm = ["npm"]
build_cmd = "build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# the code blocks of the documentation are laid out by hand, comments aligned
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# marimo displays the last expression of a cell
"lite/marimo/*.py" = ["B018"]
"examples/*.py" = ["B018"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
